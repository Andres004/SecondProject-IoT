<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">OI-2 Actuador: ESP32-DevKitC (38 pines) + 3 LEDs</text>

  <!-- ESP32 board -->
  <rect x="40" y="70" width="240" height="400" rx="10" fill="#e8eef7" stroke="#2b4a7a" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a7a">ESP32-DevKitC</text>
  <text x="160" y="120" text-anchor="middle" font-size="13" fill="#2b4a7a">38 pines</text>
  <rect x="125" y="475" width="70" height="22" rx="3" fill="#bbb" stroke="#555"/>
  <text x="160" y="491" text-anchor="middle" font-size="12" fill="#222">USB 5 V</text>

  <text x="265" y="165" text-anchor="end" font-size="14" fill="#222">GPIO25</text>
  <circle cx="280" cy="160" r="5" fill="#2b4a7a"/>
  <text x="265" y="265" text-anchor="end" font-size="14" fill="#222">GPIO26</text>
  <circle cx="280" cy="260" r="5" fill="#2b4a7a"/>
  <text x="265" y="365" text-anchor="end" font-size="14" fill="#222">GPIO27</text>
  <circle cx="280" cy="360" r="5" fill="#2b4a7a"/>
  <text x="265" y="445" text-anchor="end" font-size="14" fill="#222">GND</text>
  <circle cx="280" cy="440" r="5" fill="#2b4a7a"/>

  <!-- channel template: wire, resistor, wire, LED, wire to GND bus at x=760 -->
  <!-- Red -->
  <polyline points="280,160 380,160" fill="none" stroke="#222" stroke-width="3"/>
  <rect x="380" y="148" width="80" height="24" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="420" y="140" text-anchor="middle" font-size="13" fill="#222">220 Ω</text>
  <polyline points="460,160 560,160" fill="none" stroke="#222" stroke-width="3"/>
  <polygon points="560,140 560,180 600,160" fill="#e53935" stroke="#222" stroke-width="2"/>
  <line x1="600" y1="140" x2="600" y2="180" stroke="#222" stroke-width="3"/>
  <line x1="585" y1="135" x2="600" y2="118" stroke="#e53935" stroke-width="2"/>
  <line x1="597" y1="139" x2="612" y2="122" stroke="#e53935" stroke-width="2"/>
  <polyline points="600,160 760,160" fill="none" stroke="#222" stroke-width="3"/>
  <text x="580" y="205" text-anchor="middle" font-size="14" fill="#222">LED rojo</text>
  <text x="680" y="152" text-anchor="middle" font-size="12" fill="#555">≈ 5.9 mA</text>

  <!-- Yellow -->
  <polyline points="280,260 380,260" fill="none" stroke="#222" stroke-width="3"/>
  <rect x="380" y="248" width="80" height="24" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="420" y="240" text-anchor="middle" font-size="13" fill="#222">220 Ω</text>
  <polyline points="460,260 560,260" fill="none" stroke="#222" stroke-width="3"/>
  <polygon points="560,240 560,280 600,260" fill="#fbc02d" stroke="#222" stroke-width="2"/>
  <line x1="600" y1="240" x2="600" y2="280" stroke="#222" stroke-width="3"/>
  <line x1="585" y1="235" x2="600" y2="218" stroke="#f9a825" stroke-width="2"/>
  <line x1="597" y1="239" x2="612" y2="222" stroke="#f9a825" stroke-width="2"/>
  <polyline points="600,260 760,260" fill="none" stroke="#222" stroke-width="3"/>
  <text x="580" y="305" text-anchor="middle" font-size="14" fill="#222">LED amarillo</text>
  <text x="680" y="252" text-anchor="middle" font-size="12" fill="#555">≈ 5.5 mA</text>

  <!-- White -->
  <polyline points="280,360 380,360" fill="none" stroke="#222" stroke-width="3"/>
  <rect x="380" y="348" width="80" height="24" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="420" y="340" text-anchor="middle" font-size="13" fill="#222">220 Ω</text>
  <polyline points="460,360 560,360" fill="none" stroke="#222" stroke-width="3"/>
  <polygon points="560,340 560,380 600,360" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="600" y1="340" x2="600" y2="380" stroke="#222" stroke-width="3"/>
  <line x1="585" y1="335" x2="600" y2="318" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="597" y1="339" x2="612" y2="322" stroke="#9e9e9e" stroke-width="2"/>
  <polyline points="600,360 760,360" fill="none" stroke="#222" stroke-width="3"/>
  <text x="580" y="405" text-anchor="middle" font-size="14" fill="#222">LED blanco</text>
  <text x="680" y="352" text-anchor="middle" font-size="12" fill="#555">≈ 1.4 mA</text>

  <!-- GND bus -->
  <polyline points="760,160 760,440 280,440" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="760" cy="260" r="5" fill="#222"/>
  <circle cx="760" cy="360" r="5" fill="#222"/>
  <line x1="760" y1="440" x2="760" y2="455" stroke="#222" stroke-width="2"/>
  <line x1="745" y1="455" x2="775" y2="455" stroke="#222" stroke-width="2"/>
  <line x1="751" y1="461" x2="769" y2="461" stroke="#222" stroke-width="2"/>
  <line x1="756" y1="467" x2="764" y2="467" stroke="#222" stroke-width="2"/>
  <text x="520" y="432" text-anchor="middle" font-size="13" fill="#222">GND común (cátodos)</text>

  <text x="40" y="540" font-size="14" fill="#222">Corriente de cada LED: I = (3.3 V − Vf) / 220 Ω, con Vf ≈ 2.0 V (rojo), 2.1 V (amarillo) y 3.0 V (blanco). Máximo por pin: 20 mA.</text>
</svg>
