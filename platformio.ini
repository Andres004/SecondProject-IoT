; Two ESP32 programs in one PlatformIO project. Both use the code in lib/ and
; include/; each program compiles only its own folder inside src/.

; Settings shared by both programs.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Besides showing the serial monitor, save each session in a .log file.
monitor_filters = default, log2file

; ESP32 with the ultrasonic sensor.
[env:sensor]
build_src_filter = +<sensor/>
; Serial port of this board, needed when both boards are connected at once.
; upload_port = COM5
; monitor_port = COM5

; ESP32 with the three LEDs.
[env:actuator]
build_src_filter = +<actuator/>
; Serial port of this board, needed when both boards are connected at once.
; upload_port = COM6
; monitor_port = COM6
