; SIS-234 Lab 2: two firmwares (sensor and actuator) in a single project.
; Each environment compiles only its own folder inside src/.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, log2file

[env:sensor]
build_src_filter = +<sensor/>
; upload_port = COM5
; monitor_port = COM5

[env:actuator]
build_src_filter = +<actuator/>
; upload_port = COM6
; monitor_port = COM6